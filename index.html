<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Tic Tac Toe</title>
    <link rel="stylesheet" href="modern-normalize.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- MODE SELECTION OVERLAY -->
    <div id="mode-select">
        <div class="mode-card">
            <h2>Choose Game Mode</h2>
            <p>Who is Player 2?</p>
            <div class="mode-buttons">
                <button class="mode-btn" id="btn-pvp">
                    <span class="icon">👥</span>
                    Player vs<br>Player
                </button>
                <button class="mode-btn highlight" id="btn-pva">
                    <span class="icon">🤖</span>
                    Player vs<br>AI
                </button>
            </div>
        </div>
    </div>

    <div class="title">
        <span>tic.</span>
        <span>tac.</span>
        <span>toe.</span>
    </div>
    <div class="game-board">
        <div class="score-container">
            <div class="player-one">
                <span>PLAYER 1</span>
                <span id="player-one-score">0</span>
            </div>
            <div class="draw">
                <span>DRAW</span>
                <span id="draw-score">0</span>
            </div>
            <div class="player-two">
                <span id="player-two-label">PLAYER 2</span>
                <span id="player-two-score">0</span>
            </div>
        </div>
        <div class="buttons-container">
            <div data-index="0"></div>
            <div data-index="1"></div>
            <div data-index="2"></div>
            <div data-index="3"></div>
            <div data-index="4"></div>
            <div data-index="5"></div>
            <div data-index="6"></div>
            <div data-index="7"></div>
            <div data-index="8"></div>
        </div>
        <div class="commentator-container">
            <p id="commentator"></p>
        </div>
    </div>

    <div class="action">
        <button id="reset-board" class="button-53">Reset Board</button>
        <button id="reset-scores" class="button-53">Reset Scores</button>
        <button id="change-mode" class="button-53">Change Mode</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
